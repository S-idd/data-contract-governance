checks.db.url=${CHECKS_DB_URL:}
checks.db.path=${CHECKS_DB_PATH:/var/lib/dcg/checks.db}
checks.db.fail-fast-startup=${CHECKS_DB_FAIL_FAST_STARTUP:true}
checks.db.enforce-secure-postgres=${CHECKS_DB_ENFORCE_SECURE_POSTGRES:false}
checks.db.query-timeout=${CHECKS_DB_QUERY_TIMEOUT:3s}

checks.db.pool.minimum-idle=${CHECKS_DB_POOL_MIN_IDLE:1}
checks.db.pool.maximum-size=${CHECKS_DB_POOL_MAX_SIZE:1}
checks.db.pool.connection-timeout=${CHECKS_DB_POOL_CONNECTION_TIMEOUT:3s}
checks.db.pool.idle-timeout=${CHECKS_DB_POOL_IDLE_TIMEOUT:5m}
checks.db.pool.max-lifetime=${CHECKS_DB_POOL_MAX_LIFETIME:30m}
checks.db.pool.validation-timeout=${CHECKS_DB_POOL_VALIDATION_TIMEOUT:2s}
checks.db.pool.initialization-fail-timeout=${CHECKS_DB_POOL_INIT_FAIL_TIMEOUT:1s}

checks.db.sqlite.wal-enabled=${CHECKS_DB_SQLITE_WAL_ENABLED:true}
checks.db.sqlite.busy-timeout=${CHECKS_DB_SQLITE_BUSY_TIMEOUT:5s}
checks.db.sqlite.enforce-single-node=${CHECKS_DB_SQLITE_ENFORCE_SINGLE_NODE:true}
checks.db.sqlite.integrity-check-on-startup=${CHECKS_DB_SQLITE_INTEGRITY_CHECK_ON_STARTUP:true}
checks.db.sqlite.synchronous=${CHECKS_DB_SQLITE_SYNCHRONOUS:FULL}

app.ui.enabled=${APP_UI_ENABLED:true}
app.security.enabled=${APP_SECURITY_ENABLED:true}
app.security.require-non-default-credentials=${APP_SECURITY_REQUIRE_NON_DEFAULT_CREDENTIALS:true}
