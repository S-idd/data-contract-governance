services:
  postgres:
    image: postgres:16
    container_name: dcg-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: contracts
      POSTGRES_USER: ${DCG_DB_USERNAME:-contracts_app}
      POSTGRES_PASSWORD: ${DCG_DB_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - dcg_postgres_data:/var/lib/postgresql/data
    ports:
      - "${DCG_POSTGRES_PORT:-5432}:5432"

  contract-service:
    build:
      context: .
      dockerfile: docker/contract-service.Dockerfile
    image: dcg/contract-service:local
    container_name: dcg-service
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CONTRACTS_ROOT: ${CONTRACTS_ROOT:-/app/contracts}
      CONTRACTS_ARTIFACT_BACKEND: ${CONTRACTS_ARTIFACT_BACKEND:-filesystem}
      CONTRACTS_ARTIFACT_S3_BUCKET: ${CONTRACTS_ARTIFACT_S3_BUCKET:-}
      CONTRACTS_ARTIFACT_S3_REGION: ${CONTRACTS_ARTIFACT_S3_REGION:-us-east-1}
      CONTRACTS_ARTIFACT_S3_PREFIX: ${CONTRACTS_ARTIFACT_S3_PREFIX:-contracts}
      CONTRACTS_ARTIFACT_S3_ENDPOINT: ${CONTRACTS_ARTIFACT_S3_ENDPOINT:-}
      CONTRACTS_ARTIFACT_S3_PATH_STYLE: ${CONTRACTS_ARTIFACT_S3_PATH_STYLE:-false}
      CONTRACTS_ARTIFACT_S3_ACCESS_KEY: ${CONTRACTS_ARTIFACT_S3_ACCESS_KEY:-}
      CONTRACTS_ARTIFACT_S3_SECRET_KEY: ${CONTRACTS_ARTIFACT_S3_SECRET_KEY:-}
      CONTRACTS_ARTIFACT_S3_FALLBACK_ENABLED: ${CONTRACTS_ARTIFACT_S3_FALLBACK_ENABLED:-true}
      CONTRACTS_ARTIFACT_S3_LOCAL_CACHE_ROOT: ${CONTRACTS_ARTIFACT_S3_LOCAL_CACHE_ROOT:-/tmp/dcg-contracts-cache}
      CONTRACTS_ARTIFACT_S3_SERVER_SIDE_ENCRYPTION: ${CONTRACTS_ARTIFACT_S3_SERVER_SIDE_ENCRYPTION:-AES256}
      CONTRACTS_ARTIFACT_S3_KMS_KEY_ID: ${CONTRACTS_ARTIFACT_S3_KMS_KEY_ID:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      CHECKS_DB_URL: jdbc:postgresql://postgres:5432/contracts?currentSchema=${DCG_DB_SCHEMA:-dcg_prod}
      CHECKS_DB_EXPECTED_SCHEMA: ${DCG_DB_SCHEMA:-dcg_prod}
      CHECKS_DB_USERNAME: ${DCG_DB_USERNAME:-contracts_app}
      CHECKS_DB_PASSWORD: ${DCG_DB_PASSWORD:-change-me}
      CHECKS_DB_FAIL_FAST_STARTUP: "true"
      # Local Compose uses in-cluster plain TCP. Keep strict SSL for real prod deployments.
      CHECKS_DB_ENFORCE_SECURE_POSTGRES: "false"
      CHECKS_DB_SSL_ENABLED: "false"
      APP_UI_ENABLED: "true"
      APP_SECURITY_ENABLED: "true"
      APP_SECURITY_USERNAME: ${DCG_APP_USERNAME:-dcg-compose-admin}
      APP_SECURITY_PASSWORD: ${DCG_APP_PASSWORD:-dcg-compose-demo-password}
      APP_SECURITY_ROLES: ${DCG_APP_ROLES:-USER,WRITER}
      APP_SECURITY_WRITE_ROLE: WRITER
      APP_SECURITY_RETENTION_ROLE: ${APP_SECURITY_RETENTION_ROLE:-RETENTION_ADMIN}
      APP_SECURITY_EVIDENCE_AUTH_MODE: ${APP_SECURITY_EVIDENCE_AUTH_MODE:-OIDC}
      APP_SECURITY_EVIDENCE_AUTH_ALLOW_BASIC: ${APP_SECURITY_EVIDENCE_AUTH_ALLOW_BASIC:-false}
      CHECKS_EVIDENCE_MAX_PAYLOAD_BYTES: ${CHECKS_EVIDENCE_MAX_PAYLOAD_BYTES:-1048576}
      CHECKS_EVIDENCE_RATE_LIMIT_ENABLED: ${CHECKS_EVIDENCE_RATE_LIMIT_ENABLED:-true}
      CHECKS_EVIDENCE_RATE_LIMIT_REQUESTS_PER_WINDOW: ${CHECKS_EVIDENCE_RATE_LIMIT_REQUESTS_PER_WINDOW:-60}
      CHECKS_EVIDENCE_RATE_LIMIT_WINDOW: ${CHECKS_EVIDENCE_RATE_LIMIT_WINDOW:-1m}
      # Kept fail-closed by default. Enable a WORM run only with an Object-Lock bucket and a
      # workload identity supplied to the container through the standard AWS environment variables.
      CHECKS_EVIDENCE_RETENTION_ENABLED: ${CHECKS_EVIDENCE_RETENTION_ENABLED:-false}
      CHECKS_EVIDENCE_RETENTION_DRY_RUN: ${CHECKS_EVIDENCE_RETENTION_DRY_RUN:-true}
      CHECKS_EVIDENCE_RETENTION_POLICY_VERSION: ${CHECKS_EVIDENCE_RETENTION_POLICY_VERSION:-evidence-retention-v1}
      CHECKS_EVIDENCE_RETENTION_VERIFIED_REJECTED_RETENTION: ${CHECKS_EVIDENCE_RETENTION_VERIFIED_REJECTED_RETENTION:-2555d}
      CHECKS_EVIDENCE_RETENTION_OPERATIONAL_RETENTION: ${CHECKS_EVIDENCE_RETENTION_OPERATIONAL_RETENTION:-180d}
      CHECKS_EVIDENCE_RETENTION_BATCH_SIZE: ${CHECKS_EVIDENCE_RETENTION_BATCH_SIZE:-100}
      CHECKS_EVIDENCE_ARCHIVE_MODE: ${CHECKS_EVIDENCE_ARCHIVE_MODE:-DISABLED}
      CHECKS_EVIDENCE_ARCHIVE_FILESYSTEM_ROOT: ${CHECKS_EVIDENCE_ARCHIVE_FILESYSTEM_ROOT:-evidence-archive-rehearsal}
      CHECKS_EVIDENCE_ARCHIVE_S3_BUCKET: ${CHECKS_EVIDENCE_ARCHIVE_S3_BUCKET:-}
      CHECKS_EVIDENCE_ARCHIVE_S3_PREFIX: ${CHECKS_EVIDENCE_ARCHIVE_S3_PREFIX:-evidence}
      CHECKS_EVIDENCE_ARCHIVE_S3_REGION: ${CHECKS_EVIDENCE_ARCHIVE_S3_REGION:-us-east-1}
      CHECKS_EVIDENCE_ARCHIVE_S3_ENDPOINT: ${CHECKS_EVIDENCE_ARCHIVE_S3_ENDPOINT:-}
      CHECKS_EVIDENCE_ARCHIVE_S3_PATH_STYLE: ${CHECKS_EVIDENCE_ARCHIVE_S3_PATH_STYLE:-false}
      CHECKS_EVIDENCE_ARCHIVE_S3_ACCESS_KEY: ${CHECKS_EVIDENCE_ARCHIVE_S3_ACCESS_KEY:-}
      CHECKS_EVIDENCE_ARCHIVE_S3_SECRET_KEY: ${CHECKS_EVIDENCE_ARCHIVE_S3_SECRET_KEY:-}
      CHECKS_EVIDENCE_ARCHIVE_S3_EXPECTED_BUCKET_OWNER: ${CHECKS_EVIDENCE_ARCHIVE_S3_EXPECTED_BUCKET_OWNER:-}
      CHECKS_EVIDENCE_ARCHIVE_S3_RETENTION_DAYS: ${CHECKS_EVIDENCE_ARCHIVE_S3_RETENTION_DAYS:-2555}
      JAVA_OPTS: -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=75
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    volumes:
      - ./contracts:/app/contracts:${CONTRACTS_VOLUME_MODE:-rw}
    ports:
      - "${DCG_SERVICE_PORT:-8080}:8080"

volumes:
  dcg_postgres_data:
